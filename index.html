<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>AI 학생 공감 진단 대시보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 연수 제목 띠 → (홈) 4열 페르소나 카드 그리드 / (상세) 좌측 지표·전략 패널 + 우측 대화창과 라포 레일 */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --line:#e4e9f2; --track:#e8edf5; --field:#eef2f8;
  --panel:#0f172a; --panel-ink:#e6edf9; --panel-muted:#7f8ba3; --panel-line:#26324d; --panel-accent:#60a5fa;
  --cta-bg:#0f172a; --cta-fg:#ffffff;
  --blue:#2563eb; --orange:#f97316; --green:#059669; --pink:#ec4899; --rose:#f43f5e; --amber:#f5b301;
  --bubble-me:#2563eb; --bubble-me-ink:#ffffff; --coach-bg:#eff6ff; --coach-ink:#1e40af;
  --shadow:0 10px 30px -12px rgba(15,23,42,.18);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a111e; --surface:#131c2d; --ink:#e9eff9; --muted:#97a5bc; --faint:#6b7a93;
  --line:#243049; --track:#222d45; --field:#1b2539;
  --panel:#18233b; --panel-ink:#e6edf9; --panel-muted:#8c99b3; --panel-line:#2e3c5c; --panel-accent:#7db5ff;
  --cta-bg:#2563eb; --cta-fg:#ffffff;
  --blue:#4b83f5; --orange:#fb8a3c; --green:#22b488; --pink:#f062ad; --rose:#fb7185; --amber:#f5c542;
  --bubble-me:#2f6bea; --bubble-me-ink:#ffffff; --coach-bg:#172a4d; --coach-ink:#b6d0ff;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a111e; --surface:#131c2d; --ink:#e9eff9; --muted:#97a5bc; --faint:#6b7a93;
  --line:#243049; --track:#222d45; --field:#1b2539;
  --panel:#18233b; --panel-ink:#e6edf9; --panel-muted:#8c99b3; --panel-line:#2e3c5c; --panel-accent:#7db5ff;
  --cta-bg:#2563eb; --cta-fg:#ffffff;
  --blue:#4b83f5; --orange:#fb8a3c; --green:#22b488; --pink:#f062ad; --rose:#fb7185; --amber:#f5c542;
  --bubble-me:#2f6bea; --bubble-me-ink:#ffffff; --coach-bg:#172a4d; --coach-ink:#b6d0ff;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.strip{background:var(--surface);border-bottom:1px solid var(--line);text-align:center;padding-block:10px;
  font-weight:700;font-size:14px;letter-spacing:-.01em}
.strip span{color:var(--muted);font-weight:500}

/* 홈 */
.home{max-width:1180px;margin:0 auto;padding-block:28px 56px}
.home h1{font-size:clamp(24px,4vw,34px);font-weight:900;letter-spacing:-.03em;margin:0;text-wrap:balance}
.home .lead{color:var(--muted);margin:6px 0 24px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
@media (max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px 20px 20px;text-align:left;
  display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--blue)}
.card .emo{font-size:44px;line-height:1.1}
.card .nm{font-size:20px;font-weight:900;letter-spacing:-.02em;margin-top:6px}
.card .tp{font-size:12px;color:var(--muted);margin-bottom:10px}
.meters{display:flex;flex-direction:column;gap:9px}
.meter .row{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted)}
.meter .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.meter .bar{height:6px;border-radius:99px;background:var(--track);margin-top:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:99px}

/* 상세 */
.sbar{background:var(--surface);border-bottom:1px solid var(--line)}
.sbar .in{max-width:1420px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.back{width:38px;height:38px;border-radius:12px;background:var(--field);display:grid;place-items:center;flex:none}
.sbar .emo{font-size:34px;line-height:1}
.sbar .who{min-width:0;flex:1}
.sbar .who b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
.sbar .who small{color:var(--muted);font-size:12px}
.cta{background:var(--cta-bg);color:var(--cta-fg);font-weight:900;font-size:14px;padding:13px 20px;border-radius:14px;
  display:inline-flex;align-items:center;gap:9px;box-shadow:var(--shadow)}
.cta:hover{filter:brightness(1.15)}
.detail{max-width:1420px;margin:0 auto;padding-block:24px 40px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:1fr;gap:16px}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:var(--shadow)}
.box h2,.plan h2{font-size:15px;font-weight:900;margin:0 0 16px;display:flex;align-items:center;gap:9px}
.box h2 svg{color:var(--blue)}
.box .meters{gap:14px}
.box .meter .bar{height:8px}
.plan{background:var(--panel);color:var(--panel-ink);border-radius:32px;padding:28px;min-height:340px;box-shadow:var(--shadow)}
.plan h2{color:var(--panel-accent);font-size:17px;justify-content:space-between}
.plan h2 span{display:flex;align-items:center;gap:10px}
.refresh{width:36px;height:36px;border-radius:50%;background:var(--panel-line);color:var(--panel-ink);display:grid;place-items:center;flex:none}
.refresh:hover{background:var(--blue)}
.refresh.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plan h3{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--panel-ink);margin:18px 0 8px;display:flex;align-items:center;gap:7px}
.plan h3 svg{flex:none}
.plan .hint{font-size:12px;color:var(--panel-muted);margin:0}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li{border:1px solid var(--panel-line);border-radius:14px;padding:10px 13px;font-size:13px}
.plan li b{display:block;font-weight:700}
.plan li span{color:var(--panel-muted)}
.plan .src{font-size:11px;color:var(--panel-muted);margin-top:14px}

.chat{background:var(--surface);border:1px solid var(--line);border-radius:36px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:minmax(0,1fr) 84px;min-height:640px;overflow:hidden}
.talk{display:flex;flex-direction:column;min-width:0}
.log{flex:1;padding:28px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:62vh;min-height:320px}
.msg{max-width:82%;padding:13px 18px;border-radius:22px;font-weight:500;overflow-wrap:anywhere}
.msg.st{align-self:flex-start;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 16px -10px rgba(15,23,42,.35);font-weight:700}
.msg.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink)}
.coach{align-self:flex-end;max-width:82%;background:var(--coach-bg);color:var(--coach-ink);font-size:12px;border-radius:12px;padding:7px 11px;margin-top:-6px}
.coach b{font-weight:900;margin-right:4px}
.sys{align-self:center;font-size:12px;color:var(--muted);text-align:center}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.send{border-top:1px solid var(--line);padding:22px 26px;display:flex;gap:8px;background:var(--surface)}
.send .wrap{flex:1;display:flex;background:var(--field);border-radius:18px;padding:6px;min-width:0}
.send input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:500;padding:8px 14px;outline:none}
.send input::placeholder{color:var(--faint);font-weight:700}
.send button{width:50px;height:46px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.send button:disabled{opacity:.5;cursor:default}
.reset{align-self:center;font-size:12px;color:var(--muted);text-decoration:underline;padding:4px 8px}

.rail{border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:22px 0;gap:6px}
.rail .cap{writing-mode:vertical-rl;font-size:9px;font-weight:900;letter-spacing:.18em;color:var(--rose);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px}
.step .dot{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);color:var(--faint);display:grid;place-items:center;transition:.3s}
.step small{font-size:10px;font-weight:700;color:var(--faint)}
.step.on .dot{background:var(--blue);border-color:var(--blue);color:#fff}
.step.now .dot{background:var(--cta-bg);border-color:var(--cta-bg);color:#fff;box-shadow:0 0 0 5px var(--track)}
.step.on small,.step.now small{color:var(--ink)}
.seg{flex:1;width:3px;min-height:36px;border-radius:9px;background:var(--track);overflow:hidden;display:flex}
.seg i{display:block;width:100%;height:0;background:var(--blue);transition:height .4s,width .4s}
@media (max-width:900px){
  .chat{grid-template-columns:1fr;border-radius:26px;min-height:0}
  .rail{order:-1;flex-direction:row;border-left:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:8px}
  .rail .cap{writing-mode:horizontal-tb;margin:0 4px 0 0}
  .rail .cap span{display:none}
  .seg{height:3px;width:auto;min-height:0;min-width:12px}
  .seg i{height:100%;width:0}
  .step .dot{width:32px;height:32px}
  .log{padding:18px;max-height:52vh}.send{padding:14px}
  .box,.plan{padding:20px;border-radius:24px}
}

/* 설계도 */
.ov{position:fixed;inset:0;background:rgba(8,13,25,.6);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:24px;max-width:760px;width:100%;box-shadow:var(--shadow);overflow:hidden}
.sheet .top{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet .top .st{margin-right:auto;font-size:12px;color:var(--muted)}
.btn{padding:9px 14px;border-radius:11px;background:var(--field);font-weight:700;font-size:13px}
.btn.pri{background:var(--blue);color:#fff}
.doc{padding:30px clamp(18px,5vw,40px) 36px}
.doc .org{font-size:12px;font-weight:700;color:var(--blue)}
.doc h1{font-size:26px;font-weight:900;letter-spacing:-.03em;margin:4px 0 2px}
.doc .meta{color:var(--muted);font-size:13px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.doc h2{font-size:14px;font-weight:900;margin:22px 0 8px;color:var(--blue)}
.doc p{margin:0 0 6px}
.doc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.doc table{width:100%;border-collapse:collapse;font-size:13px}
.doc td,.doc th{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--field);white-space:nowrap;font-weight:700}
.tw{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="ov" class="ov" hidden></div>

    if(t.fb)logEl.append(h("div",{class:"coach"},h("b",{text:"코칭"}),t.fb))}
  logEl.scrollTop=logEl.scrollHeight}
function drawRail(){const r=cur.s.rap,st=stageOf(r);const kids=[h("div",{class:"cap"},h("span",{html:I.smile,style:"display:grid;writing-mode:horizontal-tb"}),h("span",{text:"RAPPORT"}))];
  STAGES.forEach((nm,i)=>{
    kids.push(h("div",{class:"step"+(i<st?" on":i===st?" now":"")},h("div",{class:"dot",html:I.st[i]}),h("small",{text:nm})));
    if(i<3){const f=clamp((r-i*25)/25,0,1)*100;const bar=h("i");
      bar.style.height=f+"%";bar.style.width=f+"%";
      const seg=h("div",{class:"seg"},bar);kids.push(seg)}});
  railEl.replaceChildren(...kids);
  // 방향에 맞는 축만 채움
  const horiz=matchMedia("(max-width:900px)").matches;
  railEl.querySelectorAll(".seg i").forEach(b=>{if(horiz)b.style.height="100%";else b.style.width="100%"})}
addEventListener("resize",()=>{if(cur&&railEl)drawRail()});

function drawPlan(loading){const p=cur,pl=p.s.plan,talked=p.s.turns.some(t=>t.r==="me");
  const list=a=>h("ul",{},a.map(([n,w])=>h("li",{},h("b",{text:n}),h("span",{text:w}))));
  const rb=h("button",{class:"refresh"+(loading?" busy":""),type:"button","aria-label":"맞춤 전략 분석",title:"맞춤 전략 분석",html:I.ref,onclick:analyze});
  rb.disabled=!!loading;
  planEl.replaceChildren(
    h("h2",{},h("span",{},h("span",{html:I.brain,style:"display:grid"}),"맞춤 성장 지원 전략"),rb),
    h("h3",{html:I.bolt+" AI 디지털 도구 추천 (2종)"}),
    loading?h("p",{class:"hint",text:"분석 중입니다…"}):pl?list(pl.tools):h("p",{class:"hint",text:"분석 버튼을 눌러 추천을 받아보세요."}),
    h("h3",{html:I.user+" 하이터치(정서 지원) 방법 (2종)"}),
    loading?h("p",{class:"hint",text:"분석 중입니다…"}):pl&&pl.ht?list(pl.ht):h("p",{class:"hint",text:talked?"분석 버튼을 눌러 대화 내용을 반영하세요.":"학생과의 대화 후 분석이 가능합니다."}),
    pl&&pl.src?h("p",{class:"src",text:pl.src}):null)}

function profile(p){return `학생: ${p.n}(${p.g}) / 유형: ${p.t}\n특성: ${p.d}\n지표: `+METRICS.map((m,i)=>`${m[1]} ${p.m[i]}%`).join(", ")}
function transcript(p){return p.s.turns.filter(t=>t.r!=="sys").map(t=>(t.r==="me"?"교사: ":"학생: ")+t.c).join("\n")}
const pairs=(a,k1,k2)=>Array.isArray(a)?a.slice(0,2).map(x=>[String(x?.[k1]??"").slice(0,60),String(x?.[k2]??"").slice(0,160)]).filter(x=>x[0]):[];

async function analyze(){const p=cur,talked=p.s.turns.some(t=>t.r==="me");if(busy)return;
  const preset=()=>({tools:p.tools,ht:talked?p.ht:null,src:"학생 유형에 따른 기본 추천입니다."});
  if(!sample){p.s.plan=preset();drawPlan();return}
  busy=true;drawPlan(true);
  try{const j=await sample.json(`교사 연수용 학습자 분석 도구다. 아래 학생에게 맞는 지원 전략을 한국어로 제안하라.\n${profile(p)}\n현재 라포: ${STAGES[stageOf(p.s.rap)]} 단계(${p.s.rap}/100)\n대화 기록:\n${transcript(p)}\n\n한국 학교에서 실제로 쓰는 에듀테크 도구 2종과, 교사가 직접 하는 정서 지원(하이터치) 방법 2종을 제안하라. 각 설명은 40자 안팎의 한 문장.\nJSON만 출력: {"tools":[{"name":"","why":""},{"name":"","why":""}],"hightouch":[{"name":"","how":""},{"name":"","how":""}]}`,{modelTier:"quick"});
    const tools=pairs(j?.tools,"name","why"),ht=pairs(j?.hightouch,"name","how");
    if(p!==cur)return;
    p.s.plan=tools.length?{tools,ht:talked&&ht.length?ht:null,src:talked?"대화 내용을 반영한 AI 분석입니다.":"학생 지표를 바탕으로 한 AI 분석입니다."}:preset();
  }catch(e){if(e?.code==="not_granted")sample=null;p.s.plan=preset()}
  finally{busy=false;if(p===cur)drawPlan()}}

const POS=/힘들|괜찮|고마|잘했|대단|멋지|마음|같이|함께|궁금|어땠|어때|그랬구나|그렇구나|이해|속상|천천히|응원|믿|도와|들어|좋아|수고|걱정|편하/;
const NEG=/해야|하지 ?마|안 ?돼|빨리|왜 ?안|똑바로|혼나|그만|당장|한심|게으/;
function localReply(p,text){let d=4;if(POS.test(text))d+=12;if(/\?|까요|니\b|어\?/.test(text))d+=4;if(NEG.test(text))d-=16;if(text.length<6)d-=3;
  const rap=clamp(p.s.rap+d,0,100);
  return {reply:p.r[stageOf(rap)],rapport_delta:d,feedback:d>=12?"학생의 감정을 먼저 읽어 준 말이 마음을 열었습니다.":d<0?"지시보다 학생의 입장을 먼저 물어보는 말로 바꿔 보세요.":"좋은 시작입니다. 감정을 짚는 말이나 열린 질문을 더해 보세요."}}

async function send(){const p=cur,text=inputEl.value.trim();if(!text||busy)return;
  busy=true;sendBtn.disabled=true;inputEl.value="";
  logEl.querySelector(".reset")?.remove();
  const me={r:"me",c:text};p.s.turns.push(me);addMsg(me);
  const wait=h("div",{class:"msg st"},h("span",{class:"dots","aria-label":"학생이 답하는 중"},h("i"),h("i"),h("i")));logEl.append(wait);logEl.scrollTop=logEl.scrollHeight;
  let out=null;
  if(sample){try{
    const j=await sample.json(`너는 교사 연수용 시뮬레이션에서 아래 학생을 연기한다. 교사(연수생)는 학생과 라포를 쌓는 연습을 하고 있다.\n${profile(p)}\n현재 라포: ${STAGES[stageOf(p.s.rap)]} 단계(${p.s.rap}/100). 단계는 경계(0~24) → 탐색(25~49) → 개방(50~74) → 신뢰(75~100).\n\n대화 기록:\n${transcript(p)}\n\n교사의 마지막 말에 학생으로서 한국어 구어체 1~3문장으로 답하라. 경계 단계에서는 짧고 방어적으로, 탐색에서는 조금 반응하고, 개방에서는 속사정을 꺼내고, 신뢰에서는 스스로 해 보겠다는 작은 다짐을 보인다. 학생 나이에 맞는 말투를 쓰고 캐릭터를 벗어나지 마라.\nrapport_delta: 교사의 마지막 말이 공감적이고 학생의 관점을 존중하며 구체적이면 +8~+20, 무난하면 0~+6, 지시·비난·무시이면 -5~-15.\nfeedback: 교사 발화에 대한 한 줄 코칭(40자 안팎, 존댓말).\nJSON만 출력: {"reply":"","rapport_delta":0,"feedback":""}`,{modelTier:"quick",cache:false});
    if(j&&typeof j.reply==="string"&&j.reply.trim())out={reply:j.reply.trim().slice(0,400),rapport_delta:clamp(Number(j.rapport_delta)||0,-15,20),feedback:String(j.feedback||"").slice(0,120)};
  }catch(e){
    if(e?.code==="not_granted"){sample=null;p.s.turns.push({r:"sys",c:"AI 연결 없이 예시 응답으로 진행합니다."})}
    else if(e?.code==="rate_limited")p.s.turns.push({r:"sys",c:"요청이 많아 이번 답은 예시 응답으로 대신합니다."})}}
  if(!out){await new Promise(r=>setTimeout(r,500));out=localReply(p,text)}
  wait.remove();
  p.s.rap=clamp(p.s.rap+out.rapport_delta,0,100);
  me.fb=out.feedback?`${out.feedback} (라포 ${out.rapport_delta>=0?"+":""}${out.rapport_delta})`:null;
  p.s.turns.push({r:"st",c:out.reply});
  busy=false;
  if(p===cur){logEl.replaceChildren();p.s.turns.forEach(addMsg);logEl.append(resetBtn());drawRail();if(!p.s.plan)drawPlan();sendBtn.disabled=false;inputEl.focus()}}

/* ───── 설계도 ───── */
function basePlan(p){const weak=METRICS[p.m.indexOf(Math.min(...p.m))][1];
  const pl=p.s.plan||{tools:p.tools,ht:p.ht};const ht=pl.ht||p.ht;
  return {diagnosis:p.d,strength:"강점 지표: "+METRICS[p.m.indexOf(Math.max(...p.m))][1]+` (${Math.max(...p.m)}%)`,
    goals:[`${weak} 지표를 한 학기 동안 단계적으로 끌어올린다.`,`교사와의 라포를 '신뢰' 단계까지 형성한다.`,`${pl.tools[0][0]} 활용 경험을 주 2회 이상 갖는다.`],
    steps:[["1단계 · 관계 형성","1~2주",`${ht[0][0]}: ${ht[0][1]}`],["2단계 · 맞춤 학습","3~6주",`${pl.tools[0][0]}와 ${pl.tools[1][0]}를 수업·과제에 적용`],["3단계 · 자기주도 확장","7주 이후",`${ht[1][0]}: ${ht[1][1]}`]],
    tip:"변화는 지표보다 학생의 말에서 먼저 나타납니다. 2주마다 짧은 대화로 상태를 확인하세요."}}

async function blueprint(p){const pl=p.s.plan||{tools:p.tools,ht:p.ht};const ht=pl.ht||p.ht;
  const today=new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"});
  let bp=basePlan(p);const said=p.s.turns.filter(t=>t.r==="me").length;
  const status=h("span",{class:"st"});const docEl=h("div",{class:"doc"});
  const render=()=>{docEl.replaceChildren(
    h("div",{class:"org",text:ORG}),h("h1",{text:"학생성장지원 설계도"}),
    h("div",{class:"meta",text:`${p.n} (${p.g}) · ${p.t} · 발행일 ${today}`}),
    h("h2",{text:"1. 핵심 성장 지표"}),
    h("div",{class:"tw"},h("table",{},h("tr",{},METRICS.map(m=>h("th",{text:m[1]}))),h("tr",{},p.m.map(v=>h("td",{text:v+"%"}))))),
    h("h2",{text:"2. 학습자 진단"}),h("p",{text:bp.diagnosis}),h("p",{text:bp.strength}),
    h("h2",{text:"3. 라포 형성 현황"}),
    h("p",{text:`현재 단계: ${STAGES[stageOf(p.s.rap)]} (${p.s.rap}/100) · 교사 발화 ${said}회`}),
    h("h2",{text:"4. 성장 목표"}),h("ul",{},bp.goals.map(g=>h("li",{text:g}))),
    h("h2",{text:"5. AI 디지털 도구"}),h("ul",{},pl.tools.map(t=>h("li",{text:`${t[0]} — ${t[1]}`}))),
    h("h2",{text:"6. 하이터치(정서 지원)"}),h("ul",{},ht.map(t=>h("li",{text:`${t[0]} — ${t[1]}`}))),
    h("h2",{text:"7. 단계별 지원 계획"}),
    h("div",{class:"tw"},h("table",{},h("tr",{},["단계","시기","지원 내용"].map(x=>h("th",{text:x}))),bp.steps.map(s=>h("tr",{},s.map(c=>h("td",{text:c})))))),
    h("h2",{text:"8. 교사 유의점"}),h("p",{text:bp.tip}))};
  render();
  const close=()=>{ov.hidden=true;ov.replaceChildren()};
  const copyBtn=h("button",{class:"btn",type:"button",text:"텍스트 복사",onclick:async()=>{
    try{await navigator.clipboard.writeText(docEl.innerText);copyBtn.textContent="복사했습니다"}
    catch(e){const r=document.createRange();r.selectNodeContents(docEl);const s=getSelection();s.removeAllRanges();s.addRange(r);copyBtn.textContent="선택됨 · Ctrl+C"}}});
  const saveBtn=h("button",{class:"btn pri",type:"button",text:"파일로 저장",onclick:async()=>{
    const html=`<!doctype html><html lang="ko"><meta charset="utf-8"><title>학생성장지원 설계도 - ${p.n}</title><style>body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.6;color:#111}h1{margin:4px 0}h2{font-size:15px;color:#1d4ed8;margin:22px 0 8px}.org{color:#1d4ed8;font-weight:700;font-size:13px}.meta{color:#555;padding-bottom:14px;border-bottom:2px solid #111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}th{background:#f1f5f9}p{margin:0 0 6px}</style>${docEl.innerHTML}</html>`;
    try{await downloads.save({filename:`학생성장지원설계도_${p.n}.html`,data:html});saveBtn.textContent="저장했습니다"}
    catch(e){if(e?.code!=="declined")saveBtn.textContent="저장할 수 없습니다"}}});
  saveBtn.hidden=!downloads;
  ov.replaceChildren(h("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":"학생성장지원 설계도"},
    h("div",{class:"top"},status,copyBtn,saveBtn,h("button",{class:"btn",type:"button",text:"닫기",onclick:close})),docEl));
  ov.hidden=false;ov.scrollTop=0;
  ov.onclick=e=>{if(e.target===ov)close()};
  if(!sample){status.textContent="기본 설계도";return}
  status.textContent="AI가 대화 내용을 반영해 다듬는 중…";
  try{const j=await sample.json(`교사 연수용 '학생성장지원 설계도'를 한국어로 작성하라. 교사가 바로 실행할 수 있게 구체적으로 쓴다.\n${profile(p)}\n라포: ${STAGES[stageOf(p.s.rap)]} 단계(${p.s.rap}/100)\n추천 도구: ${pl.tools.map(t=>t[0]).join(", ")}\n정서 지원: ${ht.map(t=>t[0]).join(", ")}\n대화 기록:\n${transcript(p)}\n\nJSON만 출력: {"diagnosis":"대화에서 드러난 점을 반영한 진단 2~3문장","strength":"강점 한 문장","goals":["목표1","목표2","목표3"],"steps":[{"phase":"1단계 · 관계 형성","period":"1~2주","action":""},{"phase":"2단계 · 맞춤 학습","period":"3~6주","action":""},{"phase":"3단계 · 자기주도 확장","period":"7주 이후","action":""}],"tip":"교사 유의점 1~2문장"}`,{modelTier:"default"});
    const S=x=>String(x??"").trim().slice(0,400);
    const steps=Array.isArray(j?.steps)?j.steps.slice(0,4).map(s=>[S(s?.phase),S(s?.period),S(s?.action)]).filter(s=>s[2]):[];
    const goals=Array.isArray(j?.goals)?j.goals.slice(0,4).map(S).filter(Boolean):[];
    if(S(j?.diagnosis)&&steps.length&&goals.length){bp={diagnosis:S(j.diagnosis),strength:S(j.strength)||bp.strength,goals,steps,tip:S(j.tip)||bp.tip};if(!ov.hidden)render();status.textContent="AI 분석 반영 완료"}
    else status.textContent="기본 설계도";
  }catch(e){if(e?.code==="not_granted")sample=null;status.textContent="기본 설계도"}}
addEventListener("keydown",e=>{if(e.key==="Escape"&&!ov.hidden){ov.hidden=true;ov.replaceChildren()}});

home();
</script>
